<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 플레이 - Merge Defense</title>
  <link rel="stylesheet" href="room.css">
</head>
<body>
  <main>
    <div>
      <a class="back-link" href="index.html">&larr; 뒤로</a>
      <h1>팀 플레이</h1>
    </div>
    <div id="status-message"></div>

    <div id="pre-room-view">
      <div class="card">
        <h2>방 만들기</h2>
        <div class="field-row">
          <input id="create-room-name" placeholder="방 이름" maxlength="24">
          <input id="create-room-password" type="password" placeholder="비밀번호 (선택)" maxlength="24">
          <select id="create-room-max">
            <option value="2">2인</option>
            <option value="3">3인</option>
            <option value="4" selected>4인</option>
            <option value="6">6인</option>
          </select>
        </div>
        <label class="check-row">
          <input id="create-room-spectators" type="checkbox" checked>
          <span>게임 관전 허용</span>
        </label>
        <button id="create-room-btn" type="button">방 만들기</button>
      </div>

      <div class="card">
        <h2>초대코드로 참가</h2>
        <div class="field-row">
          <input id="join-room-code" placeholder="초대코드 (6자리)" maxlength="6">
          <input id="join-room-password" type="password" placeholder="비밀번호 (있는 경우)" maxlength="24">
        </div>
        <button id="join-room-btn" type="button">참가하기</button>
      </div>

      <div class="card">
        <h2>열린 방 목록</h2>
        <div id="room-list"><p class="room-meta">불러오는 중...</p></div>
      </div>
    </div>

    <div id="lobby-view" class="card hidden">
      <h2 id="lobby-room-name">방 이름</h2>
      <p class="room-meta">초대코드</p>
      <p id="lobby-code">------</p>
      <div id="lobby-players"></div>
      <div class="lobby-actions">
        <button id="lobby-start-btn" type="button" class="hidden">게임 시작</button>
        <button id="lobby-leave-btn" type="button" class="ghost">나가기</button>
        <button id="lobby-delete-btn" type="button" class="danger hidden">방 삭제</button>
      </div>
      <p id="lobby-wait-message" class="room-meta"></p>
    </div>
  </main>
  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/room.js"></script>
</body>
</html>
