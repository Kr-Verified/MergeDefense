<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-board">
    <p id="name">Guest</p>
    <p id="coin-bar">3 $</p>
    <div id="defense">
      <p id="health" style="color:red; margin-bottom: 10px;">1000 Hp</p>
    </div>
  </div>
  <div id="create-bar">

      <button id="create-btn" onclick="spawnBtn()" class="btn"><p style="margin-bottom: 0;" id="spawnLv">1 생성</p><span style="font-size: 50%; position: relative; top:-10%" id="price">1 $</span></button>
      <button id="upgrade-create-btn" onclick="upgradeCreate()" class="btn">생성 단계 향상 5 $</button>
    </div>
  </div>
  <script src="script.js"></script>
