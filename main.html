<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-board">
    <p id="name">Guest</p>
    <div id="top-status">
      <span id="survival-time">0초</span>
      <span id="coin-bar">3 $</span>
      <span id="tower-count">0 / 10 포탑</span>
    </div>
    <div id="defense">
      <p id="health" style="color:red; margin-bottom: 10px;">1000 Hp</p>
    </div>
    <div id="skill-bar">
      <button id="skill-barrage" class="skill-btn" data-skill="barrage" type="button">
        <span class="skill-cooldown-fill"></span>
        <span class="skill-name">포격</span>
        <span class="skill-cooldown"></span>
      </button>
      <button id="skill-frost" class="skill-btn" data-skill="frost" type="button">
        <span class="skill-cooldown-fill"></span>
        <span class="skill-name">빙결파</span>
        <span class="skill-cooldown"></span>
      </button>
      <button id="skill-goldRush" class="skill-btn" data-skill="goldRush" type="button">
        <span class="skill-cooldown-fill"></span>
        <span class="skill-name">골드러시</span>
        <span class="skill-cooldown"></span>
      </button>
      <button id="skill-repair" class="skill-btn" data-skill="repair" type="button">
        <span class="skill-cooldown-fill"></span>
        <span class="skill-name">응급 수리</span>
        <span class="skill-cooldown"></span>
      </button>
    </div>
  </div>
  <div id="create-bar">
    <div id="inventory-toggle">
      <button id="tower-view-btn" type="button" class="inventory-tab active">포탑</button>
      <button id="item-view-btn" type="button" class="inventory-tab">아이템</button>
      <button id="blacksmith-btn" type="button" class="inventory-tab">대장장</button>
    </div>
    <div id="btn-bar">
      <button id="create-btn" onclick="spawnBtn()" class="btn"><p id="spawnLv">1 생성</p><span id="price">1 $</span></button>
      <button id="upgrade-create-btn" onclick="upgradeCreate()" class="btn">생성 단계 향상 5 $</button>
      <button id="global-speed-btn" type="button" class="btn global-upgrade-btn">전체 속도 향상</button>
      <button id="global-power-btn" type="button" class="btn global-upgrade-btn">전체 힘 향상</button>
      <button id="global-range-btn" type="button" class="btn global-upgrade-btn">전체 범위 향상</button>
      <button id="critical-chance-btn" type="button" class="btn global-upgrade-btn">치명타 확률 향상</button>
      <button id="critical-damage-btn" type="button" class="btn global-upgrade-btn">치명타 피해 향상</button>
      <button id="castle-health-btn" type="button" class="btn castle-upgrade-btn">성 체력 향상</button>
      <button id="tower-limit-btn" type="button" class="btn tower-limit-btn">설치 최대치 +1</button>
      <button id="speed-mode-btn" type="button" class="btn speed-mode-btn">1배속</button>
    </div>
    <div id="inventory-empty" class="inventory-empty hidden-inventory">비어 있음</div>
  </div>
  <div id="upgrade-modal" class="modal hidden">
    <div class="modal-panel">
      <button id="close-upgrade-modal" class="modal-close" type="button">x</button>
      <h2 id="upgrade-title">타워 업그레이드</h2>
      <div class="tower-stats">
        <p id="tower-level">Lv 1</p>
        <p id="tower-star">1성</p>
        <p id="tower-damage">공격 힘: 10</p>
        <p id="tower-speed">공격 속도: 1.00초</p>
        <p id="tower-range">공격 범위: 400</p>
        <p id="tower-hp">체력: 100 / 100</p>
        <p id="tower-time">타임: 0</p>
      </div>
      <div class="upgrade-actions">
        <div class="tower-upgrade-row">
          <button id="upgrade-speed-btn" type="button">공격 속도 향상</button>
          <button id="time-upgrade-speed-btn" type="button">타임 속도 향상</button>
        </div>
        <div class="tower-upgrade-row">
          <button id="upgrade-power-btn" type="button">공격 힘 향상</button>
          <button id="time-upgrade-power-btn" type="button">타임 힘 향상</button>
        </div>
        <div class="tower-upgrade-row">
          <button id="upgrade-range-btn" type="button">공격 범위 향상</button>
          <button id="time-upgrade-range-btn" type="button">타임 범위 향상</button>
        </div>
        <button id="time-upgrade-star-btn" type="button">2성으로 업그레이드</button>
      </div>
      <div class="targeting-panel">
        <div class="targeting-title">타게팅 우선순위</div>
        <div id="targeting-options" class="targeting-options">
          <button type="button" class="targeting-btn" data-priority="nearest">가까운 적</button>
          <button type="button" class="targeting-btn" data-priority="highestHp">체력 높은 적</button>
          <button type="button" class="targeting-btn" data-priority="lowestHp">체력 낮은 적</button>
        </div>
      </div>
      <div class="equipment-panel">
        <div class="equipment-title">장비</div>
        <div id="equipment-slots" class="equipment-slots">
          <div class="equipment-slot" data-slot="0"></div>
          <div class="equipment-slot" data-slot="1"></div>
          <div class="equipment-slot" data-slot="2"></div>
        </div>
      </div>
      <div class="sell-panel">
        <button id="sell-tower-btn" type="button" class="sell-btn">타워 판매</button>
      </div>
    </div>
  </div>

  <div id="tower-action-popup" class="tower-action-popup hidden">
    <div id="tower-action-panel" class="tower-action-panel">
      <p id="tower-action-title" class="tower-action-title">1 Lv 포탑</p>
      <p id="tower-action-subtitle" class="tower-action-subtitle">1성 · 속성 없음</p>
      <div class="tower-action-buttons">
        <button id="tower-action-delete" type="button" class="tower-action-btn danger">삭제</button>
        <button id="tower-action-disassemble" type="button" class="tower-action-btn">분해</button>
        <button id="tower-action-fuse" type="button" class="tower-action-btn">융합</button>
        <button id="tower-action-cancel" type="button" class="tower-action-btn ghost">취소</button>
      </div>
    </div>
  </div>

  <div id="delete-tower-modal" class="modal hidden">
    <div class="modal-panel">
      <button id="close-delete-tower-modal" class="modal-close" type="button">x</button>
      <h2 class="danger-title">포탑 삭제</h2>
      <p id="delete-tower-desc">이 포탑을 정말 삭제하시겠습니까?</p>
      <p id="delete-tower-cost" class="delete-tower-cost">삭제 시 0 $ 을 돌려받습니다.</p>
      <div class="delete-tower-actions">
        <button id="confirm-delete-tower-btn" type="button" class="sell-btn">삭제하기</button>
        <button id="cancel-delete-tower-btn" type="button" class="tower-action-btn ghost">취소</button>
      </div>
    </div>
  </div>

  <div id="fusion-modal" class="modal hidden">
    <div class="modal-panel">
      <button id="close-fusion-modal" class="modal-close" type="button">x</button>
      <h2>속성 융합</h2>
      <p id="fusion-current-attribute">현재 속성: 없음</p>
      <p class="orb-hint">부여할 속성 구슬을 선택하세요.</p>
      <div id="fusion-orb-list" class="orb-grid"></div>
      <button id="fusion-cancel-btn" type="button" class="tower-action-btn ghost">취소</button>
    </div>
  </div>

  <div id="blacksmith-modal" class="modal hidden">
    <div class="modal-panel">
      <button id="close-blacksmith-modal" class="modal-close" type="button">x</button>
      <h2>대장간</h2>
      <p class="orb-hint">보유 중인 속성 구슬</p>
      <div id="blacksmith-orb-list" class="orb-grid"></div>
      <p class="orb-hint">구슬 두 개를 골라 새로운 속성 구슬을 만드세요.</p>
      <div class="forge-row">
        <button id="forge-slot-0" type="button" class="forge-slot">+</button>
        <span class="forge-sign">+</span>
        <button id="forge-slot-1" type="button" class="forge-slot">+</button>
        <span class="forge-sign">→</span>
        <div id="forge-result" class="forge-slot forge-result">?</div>
      </div>
      <button id="forge-combine-btn" type="button" class="sell-btn" disabled>합성하기</button>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="team.js"></script>
  <script src="js/config.js"></script>
  <script src="js/towers.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/equipment.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/upgrade-modal.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/attribute-orbs.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
