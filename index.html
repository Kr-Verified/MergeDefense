<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>merge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 24px;
    }

    #start {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      padding: 60px 40px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      transition: 0.3s;
    }

    #start:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    }

    #start p {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #38bdf8;
    }

    #name {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background-color: #334155;
      color: #f1f5f9;
      margin-bottom: 30px;
      text-align: center;
      transition: 0.3s;
    }

    #name:focus {
      outline: 2px solid #38bdf8;
      background-color: #475569;
    }

    #start-btn {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #06b6d4, #3b82f6);
      color: white;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
    }

    #ranking {
      width: 90%;
      max-width: 360px;
      min-height: 420px;
      padding: 28px;
      border: 2px solid rgba(250, 204, 21, 0.72);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.76);
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.22);
    }

    #ranking h2 {
      margin-bottom: 20px;
      color: #facc15;
      font-size: 30px;
      text-align: center;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.38);
    }

    #ranking-list {
      display: grid;
      gap: 10px;
      list-style: none;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background-color: rgba(51, 65, 85, 0.58);
      font-size: 14px;
      font-weight: 700;
    }

    .ranking-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-time {
      color: #67e8f9;
    }

    .ranking-message {
      padding: 20px 8px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 920px) {
      body {
        height: auto;
        min-height: 100vh;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="start">
    <p style="font-size: 100px; text-align: center;">Merge</p>
    <input id="name">
    <button id="start-btn" onclick="login()">start</button>
  </div>
  <aside id="ranking">
    <h2>Ranking</h2>
    <ol id="ranking-list">
      <li class="ranking-message">랭킹 불러오는 중...</li>
    </ol>
  </aside>
  <script src="supabase-config.js"></script>
  <script>
    function getSupabaseConfig() {
      return window.SUPABASE_CONFIG || {};
    }

    function isSupabaseConfigured() {
      const config = getSupabaseConfig();
      return Boolean(config.url && (config.publicKey || config.anonKey) && config.rankingsTable);
    }

    function renderRanking(rows) {
      const list = document.getElementById('ranking-list');
      if (!rows.length) {
        list.innerHTML = '<li class="ranking-message">아직 기록이 없습니다.</li>';
        return;
      }

      list.innerHTML = rows.map((row, index) => `
        <li class="ranking-row">
          <span>#${index + 1}</span>
          <span class="ranking-name">${row.name || 'Guest'}</span>
          <span class="ranking-time">${row.survival_time || 0}초</span>
        </li>
      `).join('');
    }

    async function loadRanking() {
      const list = document.getElementById('ranking-list');
      if (!isSupabaseConfigured()) {
        list.innerHTML = '<li class="ranking-message">Supabase 설정이 필요합니다.</li>';
        return;
      }

      const config = getSupabaseConfig();
      const supabaseKey = config.publicKey || config.anonKey;
      try {
        const response = await fetch(`${config.url}/rest/v1/${config.rankingsTable}?select=name,survival_time,created_at&order=survival_time.desc&limit=10`, {
          headers: {
            apikey: supabaseKey,
            Authorization: `Bearer ${supabaseKey}`
          }
        });
        if (!response.ok) throw new Error(`Ranking request failed: ${response.status}`);
        renderRanking(await response.json());
      } catch (error) {
        console.error(error);
        list.innerHTML = '<li class="ranking-message">랭킹을 불러오지 못했습니다.</li>';
      }
    }

    function login() {
      const name = document.getElementById("name").value;
      if (name!="") {
        localStorage.setItem('name', name);
        window.location.href = 'main.html';
      }
    }

    loadRanking();
  </script>
</body>
</html>
