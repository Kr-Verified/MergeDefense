<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="start">
    <p class="title">Merge</p>
    <input id="name" maxlength="24">
    <button id="start-btn" type="button">start</button>
    <button id="team-btn" type="button">팀 플레이</button>
  </div>
  <section id="rankings" aria-label="랭킹">

      <ol id="ranking-list">
        <li class="ranking-message">랭킹 불러오는 중...</li>
      </ol>
    </aside>
    <aside class="ranking-panel team-ranking-panel">
      <h2>팀 랭킹</h2>
      <ol id="team-ranking-list">
        <li class="ranking-message">랭킹 불러오는 중...</li>
      </ol>
    </aside>
  </section>
  <script src="js/audio.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/index.js"></script>

</html>
