<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>merge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #start {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      padding: 60px 40px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      transition: 0.3s;
    }

    #start:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    }

    #start p {
      font-size: 48px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #38bdf8;
    }

    #name {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background-color: #334155;
      color: #f1f5f9;
      margin-bottom: 30px;
      text-align: center;
      transition: 0.3s;
    }

    #name:focus {
      outline: 2px solid #38bdf8;
      background-color: #475569;
    }

    #start-btn {
      width: 100%;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #06b6d4, #3b82f6);
      color: white;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
    }
  </style>
</head>
<body style="display: flex; justify-content: center;">
  <div id="start">
    <p style="font-size: 100px; text-align: center;">Merge</p>
    <input id="name">
    <button id="start-btn" onclick="login()">start</button>
  </div>
  <script>
    function login() {
      const name = document.getElementById("name").value;
      if (name!="") {
        localStorage.setItem('name', name);
        window.location.href = 'main.html';
      }
    }
  </script>
</body>
</html>
